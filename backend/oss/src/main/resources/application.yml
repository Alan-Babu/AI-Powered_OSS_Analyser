spring:
  application:
    name: oss-risk-analyzer
  
  # Completely exclude Redis and Kafka auto-configuration for testing
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.kafka.annotation.KafkaBootstrapConfiguration
  
  datasource:
    # Temporarily use H2 in-memory database for testing
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  # Enable H2 console for testing
  h2:
    console:
      enabled: true
      path: /h2-console
  
  data:
    redis:
      # Completely disable Redis for testing
      enabled: false
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  kafka:
    # Temporarily disable Kafka for testing
    enabled: false
    bootstrap-servers: localhost:9092
    consumer:
      group-id: oss-analyzer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  
  security:
    user:
      name: admin
      password: admin
  
  cloud:
    compatibility-verifier:
      enabled: false
    circuitbreaker:
      resilience4j:
        instances:
          default:
            sliding-window-size: 10
            minimum-number-of-calls: 5
            permitted-number-of-calls-in-half-open-state: 3
            automatic-transition-from-open-to-half-open-enabled: true
            wait-duration-in-open-state: 5s
            failure-rate-threshold: 50

# JWT Configuration
app:
  jwt:
    secret: your-secret-key-here-make-it-very-long-and-secure-in-production
    expiration: 86400000 # 24 hours in milliseconds

# OSSIndex API Configuration
ossindex:
  api:
    url: https://ossindex.sonatype.org/api/v3/component-report
    username: your-username
    token: your-token

# AI-ML Services Configuration
ai-ml:
  services:
    nlp-explainer:
      url: http://localhost:8002
    security-scanner:
      url: http://localhost:8001
    risk-model:
      url: http://localhost:8003
    knowledge-graph:
      url: http://localhost:8004

# Logging Configuration
logging:
  level:
    com.ossrisk.oss: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cache: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Server Configuration
server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
