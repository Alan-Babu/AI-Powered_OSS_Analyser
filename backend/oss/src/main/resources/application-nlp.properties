# NLP Service Configuration
nlp.service.url=http://localhost:8001
nlp.service.enabled=true

# NLP Service Timeouts
nlp.service.timeout.connection=5000
nlp.service.timeout.read=10000

# NLP Service Confidence Thresholds
nlp.confidence.threshold.fix=0.5
nlp.confidence.threshold.remediation=0.3

# Fallback Configuration
nlp.fallback.enabled=true
nlp.retry.max-attempts=3
nlp.retry.delay=1000

