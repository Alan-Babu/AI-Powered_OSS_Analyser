spring.application.name=oss
# ==== Server Configuration ====
server.port=8080

# ==== Database Configuration ====
spring.datasource.url=jdbc:postgresql://localhost:5432/ossriskdb
spring.datasource.username=dbuser
spring.datasource.password=dbpass
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== JPA / Hibernate ====
#options: none, validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===Sonatype Oss index ===
ossindex.api.username=ossindexusername
ossindex.api.token=apitoken
ossindex.api.url=https://ossindex.sonatype.org/api/v3/component-report

# ==== jwt Configuration ====
app.jwt.secret=Jp7z5bR9yXcO7yYvZ+Aa+3HjjkQo6A3kV0uzx8nPtb0d2YQ+U0QhVrxuBEnBzj8KvU9Wk3uOzxJgHHDZTzDPaA==
app.jwt.expiration-ms=86400000  # 24 hours

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC




