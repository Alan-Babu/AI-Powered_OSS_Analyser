<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Sign In</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="text" formControlName="usernameOrEmail"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:ring-blue-200">
        <div *ngIf="form.get('usernameOrEmail')?.invalid && form.get('usernameOrEmail')?.touched"
             class="text-sm text-red-500 mt-1">
          Email is required.
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" formControlName="password"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:ring-blue-200">
        <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
             class="text-sm text-red-500 mt-1">
          Password is required (min 6 chars).
        </div>
      </div>

      <div *ngIf="errorMessage" class="text-red-600 text-sm text-center">{{ errorMessage }}</div>

      <button type="submit"
              [disabled]="form.invalid || isLoading"
              class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Signing In...</span>
      </button>
    </form>

    <p class="text-sm text-gray-600 text-center mt-4">
      Don’t have an account?
      <a routerLink="/signup" class="text-blue-600 hover:underline">Sign up</a>
    </p>
  </div>
</div>
