<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Create Account</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" formControlName="username"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:ring-blue-200">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" formControlName="email"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:ring-blue-200">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" formControlName="password"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:ring-blue-200">
      </div>

      <div *ngIf="successMessage" class="text-green-600 text-sm text-center">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="text-red-600 text-sm text-center">{{ errorMessage }}</div>

      <button type="submit"
              [disabled]="form.invalid || isLoading"
              class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition-colors">
        <span *ngIf="!isLoading">Sign Up</span>
        <span *ngIf="isLoading">Creating Account...</span>
      </button>
    </form>

    <p class="text-sm text-gray-600 text-center mt-4">
      Already have an account?
      <a routerLink="/signin" class="text-blue-600 hover:underline">Sign in</a>
    </p>
  </div>
</div>
