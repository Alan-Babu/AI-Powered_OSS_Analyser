<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Code Quality & Suggestions</h1>
    <p class="text-gray-600">Paste code to get AI-powered review and improvements.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="analyze()" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Filename</label>
        <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg" formControlName="filename" placeholder="e.g. app.service.ts" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Language</label>
        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg" formControlName="language">
          <option value="typescript">TypeScript</option>
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
          <option value="java">Java</option>
        </select>
      </div>
      <div class="flex items-end">
        <button type="submit" [disabled]="isAnalyzing || form.invalid" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
          {{ isAnalyzing ? 'Analyzing...' : 'Analyze Code' }}
        </button>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Code</label>
      <textarea rows="14" class="w-full px-3 py-2 border border-gray-300 rounded-lg font-mono" formControlName="content" placeholder="Paste your code here..."></textarea>
    </div>

    <div *ngIf="errorMessage" class="text-red-600">{{ errorMessage }}</div>
  </form>

  <div *ngIf="results" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
    <h2 class="text-xl font-semibold text-gray-900">Suggestions</h2>
    <pre class="p-4 bg-gray-50 rounded-lg whitespace-pre-wrap">{{ results | json }}</pre>
  </div>
</div>
